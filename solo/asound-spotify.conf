# Spotify (Soloist) plays through its own softvol, NOT the shared "Master":
# Alice's voice stays on Master, so the proxy can duck the music during dialogs
# and silence only Alice, while keeping the music at Alice's volume otherwise
# (alice-voice-proxy mirrors Master -> "Spotify").  Loaded by run.sh via
# ALSA_CONFIG_PATH; dmix_spk_plug comes from /etc/asound.conf.
pcm.spotify {
  type softvol
  slave.pcm "dmix_spk_plug"
  control {
    name "Spotify Playback Volume"
    card 0
  }
}
